

- name: create user if not exists 
  ansible.builtin.user:
    name: roboshop
    state: present 

- name: recursively remove a directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: create a directory id doesn't exists 
  ansible.builtin.file:
    path: /app
    state: directory 

# - name: "Download the {{component}} code" 
#   ansible.builtin.get_url:
#     url: "https://roboshop-builds.s3.amazonaws.com/{{component}}.zip"
#     dest: "/tmp/{{component}}.zip"

- name: "Downloading {{ component }} Module Zip"
  ansible.builtin.get_url:
    url: >-
      {{
        'https://shipping-data-sql-file.s3.us-east-1.amazonaws.com/shipping.zip'
        if component == 'shipping'
        else
        'https://roboshop-builds.s3.amazonaws.com/' ~ component ~ '.zip'
      }}
    dest: "/tmp/{{ component }}.zip"

- name: "unzip the downloaded {{component}} code" 
  ansible.builtin.unarchive: 
    src: "/tmp/{{component}}.zip"
    dest: /app
    remote_src: yes 