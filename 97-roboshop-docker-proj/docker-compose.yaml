#it will create roboshop network automatically when docker compose up and destroy automatically when docker compose down
#u mentioned default --> it will create roboshop network and set as default network & in this case no need to mention in --> service level as networks: -roboshop like this 

networks:
  default:        #by default ot creates bridge so no need to mention type of network & no need to mention networks section in each service it will by default apply because we mentioned default in this defination 
    name: roboshop
    driver: bridge    #to mention type of network

services:
  mongodb:
    build: ./mongodb
    image: mongodb:v1
    container_name: mongodb
    # networks:
    #   - roboshop

  catalogue:
    build: ./catalogue
    image: catalogue:v1 
    container_name: catalogue 
    depends_on:
    - mongodb

  web:
    build: ./web
    image: web:v1 
    container_name: web 
    ports:
    - "80:80"
    depends_on:
    - catalogue
    - user 
    - cart 
    - shipping
    - payment

# for user and cart we need redis db so first redis the cart and user 

  redis:        #we can give only this line also no issue 
    build: ./redis
    image: redis
    container_name: redis

  user:
    build: ./user
    image: user:v1 
    container_name: user
    depends_on:
    - redis 
    - mongodb  

  cart:                 #normally this will be set as container name like 97-roboshop-docker-proj-cart-v1 (Format : folder_name-component_name-version) if u dont mention using container_name
    build: ./cart
    image: cart:v1 
    container_name: cart
    depends_on:
    - redis 
    - catalogue  

  mysql:                 #normally this will be set as container name if u dont mention using  container_name
    build: ./mysql
    image: mysql:v1 
    container_name: mysql
    environment:
      - DB_HOST=mysql
      - MYSQL_PASSWORD=RoboShop@1
      - MYSQL_ROOT_PASSWORD=RoboShop@1
      - MYSQL_USER=shipping
      - MYSQL_DATABASE=cities
  
  shipping:
    build: ./shipping
    image: shipping:v1 
    container_name: shipping
    environment:
    - CART_ENDPOINT=cart:8080
    depends_on:
    - mysql
    - cart

  rabbitmq:
    build: ./rabbitmq
    image: rabbitmq
    container_name: rabbitmq
    environment:
    - RABBITMQ_DEFAULT_USER=roboshop
    - RABBITMQ_DEFAULT_PASS=roboshop123

  payment:
    build: ./payment
    image: payment:v1 
    container_name: payment
    depends_on: 
    - cart
    - user
    - rabbitmq



