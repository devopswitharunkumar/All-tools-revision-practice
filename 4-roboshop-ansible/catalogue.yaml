- name: catalogue 
  hosts: catalogue
  become: true 
  tasks:
  - name: disable existing module and enable particular module
    ansible.builtin.shell: dnf module disable nodejs -y; dnf module enable nodejs:18 -y 
  
  - name: install nodejs 
    ansible.builtin.package:
      name: nodejs 
      state: present

  - name: create user if not exists 
    ansible.builtin.user:
      name: roboshop
      state: present 
  
  - name: recursively remove a directory
    ansible.builtin.file:
      path: /app
      state: absent

  - name: create a directory id doesn't exists 
    ansible.builtin.file:
      path: /app
      state: directory 
  
  - name: Download the catalogue code 
    ansible.builtin.get_url:
      url: https://roboshop-builds.s3.amazonaws.com/catalogue.zip
      dest: /tmp/catalogue.zip
  
  - name: unzip the downloaded catalogue code 
    ansible.builtin.unarchive: 
      src: /tmp/catalogue.zip
      dest: /app
      remote_src: yes 
  
  - name: install dependencies 
    ansible.builtin.command: npm install 
    args:
      chdir: /app 
  
  - name: copy service file 
    ansible.builtin.copy:
      src: catalogue.service 
      dest: /etc/systemd/system/catalogue.service

  - name: reload daemon 
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: copy mongo repo file 
    ansible.builtin.copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  
  - name: install mongodb 
    ansible.builtin.dnf:
      name: mongodb-org-shell 
      state: present 
  
  - name: check the categories count 
    ansible.builtin.command: mongo --host mongodb.devopswitharun.online --quiet --eval 'db=db.getSibilingDB('catalogue'); db.products.count()'
    register: product_count

  - name: print the count 
    ansible.builtin.debug: 
      msg: "product_count is : {{product_count}}"

  - name: loading the schema 
    ansible.builtin.shell: mongo --host mongodb.devopswitharun.online </app/schema/catalogue.js
    when: product_count.stdout == "0"

  - name: Enable and start the catalogue service 
    ansible.builtin.service:
      name: catalogue 
      state: started 
      enabled: true 

