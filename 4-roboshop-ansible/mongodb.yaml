- name: mongodb 
  hosts: mongodb
  become: true 
  tasks:
  - name: copy mongo.repo file 
    ansible.builtin.copy:
      source: mongo.repo
      destination: /etc/yum.repos.d/mongo.repo
  
  - name: install mongodb
    ansible.builtin.package:
      name: mongodb-org
      state: present 

  - name: Enable and start mongodb
    ansible.builtin.service:
      name: mongod
      state: started 
      enabled: true 
  
  - name: replace the remote connections 
    ansible.builtin.replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'
  
  - name: restart mongodb
    ansible.builtin.service:
      name: mongod
      state: restarted 