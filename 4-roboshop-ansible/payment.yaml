- name: payment   
  hosts: payment 
  become: true 
  tasks: 
  - name: install python 
    ansible.builtin.package:
      name: "{{item}}" 
      state: present
    loop: 
    - python3
    - gcc
    - python3-devel

  - name: create roboshop user
    ansible.builtin.user:
      name: roboshop
    
  - name: recursively remove app directory
    ansible.builtin.file:
      path: /app
      state: absent
  
  - name: create app directory
    ansible.builtin.file:
      path: /app
      state: directory
    
  - name: Downloading payment zip modue
    ansible.builtin.get_url:
      url: https://roboshop-builds.s3.amazonaws.com/payment.zip
      dest: /tmp/payment.zip
  
  - name: unzipping the payment module
    ansible.builtin.unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes
  
  - name: install python dependencies
    ansible.builtin.command: pip3.9 install -r requirements.txt
    args:
      chdir: /app

  - name: copying payment service
    ansible.builtin.copy:
      src: payment.service
      dest: /etc/systemd/system/payment.service

  - name: daemon reload
    ansible.builtin.systemd_service:
      daemon_reload: true

  - name: start and enable payment modue
    ansible.builtin.service:
      name: payment
      state: restarted
      enabled: yes