

- name: create user if not exists 
  ansible.builtin.user:
    name: roboshop
    state: present 

- name: recursively remove a directory
  ansible.builtin.file:
    path: /app
    state: absent

- name: create a directory if doesn't exists 
  ansible.builtin.file:
    path: /app
    state: directory 

