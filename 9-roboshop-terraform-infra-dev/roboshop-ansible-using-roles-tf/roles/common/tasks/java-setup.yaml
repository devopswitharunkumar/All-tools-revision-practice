#For CD process --> this step is fine already build and installed and pushed jar to nexus and downloading jar from nexus that file is sufficient fo run java application 

- name: Copy JAR artifact
  ansible.builtin.copy:
    src: "/tmp/{{ component }}-{{ app_version }}.jar"
    dest: "/app/"
    remote_src: yes
  when: packaging == "jar"