- name: Download redis remi release
  ansible.builtin.get_url:
    url: http://rpms.remirepo.net/enterprise/remi-release-9.rpm
    dest: /tmp/remi-release-9.rpm
    mode: '0644'

- name: Install redis remi release
  ansible.builtin.dnf:
    name: /tmp/remi-release-9.rpm
    state: present
    disable_gpg_check: true

- name: enable redis version 
  ansible.builtin.command: dnf module enable redis:remi-6.2 -y

- name: install redis
  ansible.builtin.package:
    name: redis 
    state: present 

- name: replace remote access 
  ansible.builtin.replace:
    path: /etc/redis/redis.conf 
    regexp: '127.0.0.1' 
    replace: '0.0.0.0'

- name: Enable and start redis
  ansible.builtin.service:
    name: redis
    state: restarted
    enabled: yes