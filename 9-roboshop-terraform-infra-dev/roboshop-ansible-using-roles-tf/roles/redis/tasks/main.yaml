- name: Enable Redis module
  ansible.builtin.command:
    cmd: dnf module enable redis:7 -y
  register: redis_module
  changed_when: "'Nothing to do' not in redis_module.stdout"

- name: Install Redis
  ansible.builtin.dnf:
    name: redis
    state: present

- name: Configure Redis remote access
  ansible.builtin.replace:
    path: /etc/redis/redis.conf
    regexp: '^bind 127\.0\.0\.1'
    replace: 'bind 0.0.0.0'
  notify: Restart Redis

#only of CD process of redis Jenkins pipeline 
- name: Disable Redis protected mode
  ansible.builtin.replace:
    path: /etc/redis/redis.conf
    regexp: '^protected-mode yes'
    replace: 'protected-mode no'
  notify: Restart Redis

- name: Enable and start Redis
  ansible.builtin.service:
    name: redis
    state: started
    enabled: true