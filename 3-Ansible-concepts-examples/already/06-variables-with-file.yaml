- name: nginx with ynamic variables
  hosts: web 
  become: true 
  vars_files:
  - declare-variables-values.yaml
  tasks:
  - name: "install {{package_name}}"
    ansibl.built-in.dnf:
      name: "{{package_name}}"
      state: "{{state}}" 

  - name: "run {{package_name}}"
    ansible.built-in.service:
      name: "{{package_name}}"
      state: started 
      enabled: true 
      
  - name: General info msg 
    ansibl.built-in.debug:
      msg:"Hi Im learning {{course}}"

#Run : ansible-playbook -i inventory.ini -e ansible_user="ec2-user" -e ansible_password="DevOps321" 06-variables-with-file.yaml