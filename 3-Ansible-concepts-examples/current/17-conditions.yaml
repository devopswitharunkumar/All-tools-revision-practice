- name: conditions playbook 
  hosts: practice
  become: true 
  vars:
    stringcomparison: "Arun"
    numericcomparison: 5
    booleancomparison: true
  tasks:
  - name: String comparision
    ansible.builtin.debug:
      msg: "Hi this is {{stringcomparison}} and from string comparision"
    when: stringcomparison == "Arun"
  
  - name: numeric comparision
    ansible.builtin.debug:
      msg: "Hi this is {{numericcomparison}} and from numeric comparision"
    when: numericcomparison == 5

#in numeric comparision we have =, !=, > , < , >= , <= 

  - name: boolean comparision
    ansible.builtin.debug:
      msg: "Hi this is booleancomparison: {{booleancomparison}} and from boolean comparision"
    when: booleancomparison 

  - name: AND comparision
    ansible.builtin.debug:
      msg: "Hi this is AND comparision"
    # when: stringcomparison == "Arun" and numericcomparison == 5
    # or 
    when:
    - stringcomparison == "Arun"  
    - numericcomparison == 0

  - name: OR comparision
    ansible.builtin.debug:
      msg: "Hi this is OR comparision"
    # when: stringcomparison == "Arun" or numericcomparison == 1
    # or
    when: >
      stringcomparison == "kumar"
      numericcomparison == 1

  - name: Both AND and OR combination
    ansible.builtin.debug:
      msg: "Hi this is AND and OR combination"
    when: 
    - stringcomparison == "Arun"
    - (numericcomparison == 5 or booleancomparison)